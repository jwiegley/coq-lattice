name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build (default)
        run: nix build --print-build-logs
      - name: Flake check
        run: nix flake check --print-build-logs

  coq-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - coq_8_18
          - coq_8_19
          - coq_8_20
          - coq_9_0
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build with ${{ matrix.package }}
        run: nix build .#${{ matrix.package }} --print-build-logs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Format check
        run: nix build .#checks.x86_64-linux.format --print-build-logs
      - name: Lint check
        run: nix build .#checks.x86_64-linux.lint --print-build-logs
